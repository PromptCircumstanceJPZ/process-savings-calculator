<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Process Savings Calculator</title>
  </head>
  <body>
    <h1>My Process Savings Calculator</h1>
  <p>Estimate how much time a process improvement could save. </p>
    <label for="before">Minutes per task before improvement:</label>
    <input type="number" id="before" min="0" step="any">
    <br><br>
    <label for="after">Minutes per task after improvement:</label>
    <input type= "number" id="after" min="0" step="any">
    <br><br>
    <label for="volume">Number of tasks per month:</label>
    <input type="number" id="volume" min="0" step="1">
    <br><br>
    <button type="button" onclick="calculateSavings()">CalculateSavings</button>
    <p id="result">Your savings will appear here.</p>
    <script>
      function calculateSavings() { 
        const before = document.getElementById("before").valueAsNumber;
        const after = document.getElementById("after"). valueAsNumber;
        const volume = document.getElementById("volume").valueAsNumber;
        const hoursSaved = (before - after) * volume / 60; 
        
    document.getElementById("result").textContent = "The button works!";
      }
    </script>
  </body>
</html>
